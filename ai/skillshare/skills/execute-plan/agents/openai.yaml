interface:
  display_name: "Execute Plan"
  short_description: "Execute plans or session scope with selected review loops"
  default_prompt: "Use $execute-plan to complete my supplied plan or work resolved from session context with final-pass after every phase, internal review by default or my requested external reviewer(s) (including two-pass Codex, Claude, or Gemini) or internal followed by external, then a final final-pass, while preserving agreed commitments and resolving task-relevant issues and required checks."
policy:
  allow_implicit_invocation: true
